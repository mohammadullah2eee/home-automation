<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" font-family="Arial, Helvetica, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect width="900" height="500" fill="#ffffff"/>
  <text x="450" y="30" text-anchor="middle" font-size="20" font-weight="700" fill="#0f172a">ESP32 Wi-Fi Home Automation: wiring and signal path</text>

  <!-- phone -->
  <rect x="330" y="50" width="240" height="56" rx="10" fill="#e8f1fb" stroke="#1d7be0" stroke-width="2"/>
  <text x="450" y="74" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">Phone, laptop or any Wi-Fi device</text>
  <text x="450" y="94" text-anchor="middle" font-size="13" fill="#334155">opens http://192.168.4.1 in a browser</text>
  <path d="M370 106 L170 160" stroke="#1d7be0" stroke-width="2.5" stroke-dasharray="7 6" fill="none"/>
  <text x="200" y="124" font-size="13" fill="#1d7be0" font-weight="700">Wi-Fi: ESP_HomeAutomation</text>

  <!-- ESP32 -->
  <rect x="40" y="160" width="230" height="250" rx="12" fill="#f1f5f9" stroke="#0f172a" stroke-width="2"/>
  <text x="155" y="190" text-anchor="middle" font-size="17" font-weight="700" fill="#0f172a">ESP32 board</text>
  <text x="155" y="210" text-anchor="middle" font-size="12" fill="#475569">(Wi-Fi access point + web server)</text>
  <g font-size="14" fill="#0f172a" text-anchor="end">
    <text x="250" y="259">5V (VIN)</text>
    <text x="250" y="299">GND</text>
    <text x="250" y="339">GPIO16</text>
    <text x="250" y="379">GPIO17</text>
  </g>
  <g fill="#0f172a"><circle cx="270" cy="255" r="5"/><circle cx="270" cy="295" r="5"/><circle cx="270" cy="335" r="5"/><circle cx="270" cy="375" r="5"/></g>

  <!-- signal wires -->
  <line x1="270" y1="255" x2="380" y2="255" stroke="#dc2626" stroke-width="3"/>
  <line x1="270" y1="295" x2="380" y2="295" stroke="#111827" stroke-width="3"/>
  <line x1="270" y1="335" x2="380" y2="335" stroke="#2563eb" stroke-width="3"/>
  <line x1="270" y1="375" x2="380" y2="375" stroke="#16a34a" stroke-width="3"/>

  <!-- relay module -->
  <rect x="380" y="160" width="200" height="250" rx="12" fill="#fef9c3" stroke="#a16207" stroke-width="2"/>
  <text x="480" y="190" text-anchor="middle" font-size="16" font-weight="700" fill="#422006">2-channel relay module</text>
  <text x="480" y="210" text-anchor="middle" font-size="12" fill="#713f12">(5V, active-LOW)</text>
  <g font-size="14" fill="#422006">
    <text x="392" y="259">VCC</text>
    <text x="392" y="299">GND</text>
    <text x="392" y="339">IN1 (Fan)</text>
    <text x="392" y="379">IN2 (Light)</text>
  </g>
  <g font-size="14" fill="#422006" text-anchor="end">
    <text x="568" y="239">COM1</text>
    <text x="568" y="269">NO1</text>
    <text x="568" y="339">COM2</text>
    <text x="568" y="369">NO2</text>
  </g>
  <g fill="#422006"><circle cx="580" cy="235" r="5"/><circle cx="580" cy="265" r="5"/><circle cx="580" cy="335" r="5"/><circle cx="580" cy="365" r="5"/></g>

  <!-- power source and loads -->
  <rect x="610" y="430" width="270" height="44" rx="8" fill="#ffedd5" stroke="#c2410c" stroke-width="2"/>
  <text x="745" y="457" text-anchor="middle" font-size="14" font-weight="700" fill="#7c2d12">5V rail from the breadboard power module</text>
  <path d="M580 235 L600 235 L600 452 L610 452" stroke="#ea580c" stroke-width="3" fill="none"/>
  <path d="M580 335 L610 335" stroke="#ea580c" stroke-width="3" fill="none"/>

  <rect x="700" y="215" width="170" height="70" rx="10" fill="#e0f2fe" stroke="#0369a1" stroke-width="2"/>
  <text x="785" y="246" text-anchor="middle" font-size="16" font-weight="700" fill="#0c4a6e">5V DC cooling fan</text>
  <text x="785" y="267" text-anchor="middle" font-size="12" fill="#0c4a6e">switched by relay 1 (IN1)</text>
  <rect x="700" y="315" width="170" height="70" rx="10" fill="#e0f2fe" stroke="#0369a1" stroke-width="2"/>
  <text x="785" y="346" text-anchor="middle" font-size="16" font-weight="700" fill="#0c4a6e">LED + 220 ohm resistor</text>
  <text x="785" y="367" text-anchor="middle" font-size="12" fill="#0c4a6e">switched by relay 2 (IN2)</text>
  <path d="M580 265 L640 265 L640 250 L700 250" stroke="#0369a1" stroke-width="3" fill="none"/>
  <path d="M580 365 L640 365 L640 350 L700 350" stroke="#0369a1" stroke-width="3" fill="none"/>

  <text x="450" y="490" text-anchor="middle" font-size="12" fill="#475569">Fan (-) and LED cathode go to GND. All grounds (battery module, relay, ESP32) must be joined. This build uses 5V loads only.</text>
</svg>
