<!DOCTYPE html><html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<!--
  PREVIEW COPY of the dashboard that the ESP32 sends to the browser.
  The HTML and CSS below are the same as the sketch's client.println() lines.
  On the real board the ON/OFF links (/fan/on, /fan/off, /led/on, /led/off) switch the relays.
  Here a few lines of JavaScript at the bottom only imitate that, so you can click the buttons
  and see both states. The script is NOT part of the ESP32 code.
-->
<style>
body { font-family: Arial; text-align: center; background: #0f172a; color: white; margin:0; }
.container { display:flex; flex-direction:column; justify-content:center; align-items:center; height:100vh; }
.card { background:#1e293b; padding:20px; border-radius:15px; margin:10px; width:250px; }
.button { padding:15px 30px; font-size:20px; border:none; border-radius:10px; cursor:pointer; color:white; }
.on { background:#22c55e; }
.off { background:#ef4444; }
</style></head>
<body>
<div class="container">
<h1>ESP32 Smart Control</h1>
<div class="card" id="card-fan"><h3>Fan</h3><a href="/fan/on"><button class="button on">ON</button></a></div>
<div class="card" id="card-led"><h3>LED</h3><a href="/led/on"><button class="button on">ON</button></a></div>
</div>
<script>
/* Preview only: imitates what the ESP32 does when you press a button. */
var state = { fan: "off", led: "off" };
var title = { fan: "Fan", led: "LED" };
function draw(name) {
  var link = state[name] === "off"
    ? '<a href="/' + name + '/on"><button class="button on">ON</button></a>'
    : '<a href="/' + name + '/off"><button class="button off">OFF</button></a>';
  document.getElementById("card-" + name).innerHTML = "<h3>" + title[name] + "</h3>" + link;
}
document.addEventListener("click", function (e) {
  var a = e.target.closest("a");
  if (!a) return;
  e.preventDefault();
  var m = a.getAttribute("href").match(/^\/(fan|led)\/(on|off)$/);
  if (m) { state[m[1]] = m[2]; draw(m[1]); }
});
</script>
</body></html>
